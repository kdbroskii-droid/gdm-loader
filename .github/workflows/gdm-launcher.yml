name: Prepare GD M Android launcher APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gdm-launcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GD M project and native launcher submodule
        uses: actions/checkout@v4
        with:
          path: gdm
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"

      - name: Build GD M Geode mod
        id: mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: gdm/geode-mod
          target: Android64
          sdk: given

      - name: Integrate GD M mod and rebrand native launcher
        shell: bash
        run: |
          set -euo pipefail
          MOD_DIR="${{ steps.mod.outputs.build-output }}"
          MOD_FILE="$(find "$MOD_DIR" -maxdepth 2 -type f -name '*.geode' -print -quit)"
          test -n "$MOD_FILE"
          mkdir -p gdm/native-launcher/app/src/main/assets/mods
          cp "$MOD_FILE" gdm/native-launcher/app/src/main/assets/mods/gdm-loader.geode

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("gdm/native-launcher")
          gradle_file = root / "app/build.gradle.kts"
          gradle = gradle_file.read_text()
          old = 'applicationId = "com.geode.launcher"'
          new = 'applicationId = "com.judsz.gdm"'
          if old not in gradle:
              raise SystemExit("Could not find upstream standard applicationId; launcher source layout changed.")
          gradle_file.write_text(gradle.replace(old, new, 1))

          strings_file = root / "app/src/main/res/values/strings.xml"
          strings = strings_file.read_text()
          strings = re.sub(r'(<string name="app_name"[^>]*>).*?(</string>)',
                           r'\1GD M / Judsz\2', strings, count=1)
          strings = re.sub(r'(<string name="launcher_title"[^>]*>).*?(</string>)',
                           r'\1GD M\2', strings, count=1)
          strings_file.write_text(strings)
          PY

      - name: Build debug APK
        working-directory: gdm/native-launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleStandardDebug

      - name: Upload GD M launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: gdm-android-launcher-debug
          path: gdm/native-launcher/app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 30
