name: Build GD M Geode mod
on:
  push:
    paths:
      - "geode-mod/**"
      - ".github/workflows/geode-mod.yml"
  pull_request:
    paths:
      - "geode-mod/**"
      - ".github/workflows/geode-mod.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Android 64-bit Geode package
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: geode-mod
          target: Android64
          sdk: given
      - name: Upload .geode package
        uses: actions/upload-artifact@v4
        with:
          name: gd-m-geode-android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 30
