name: Validate GDM Loader Android project
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js
      - name: Check APK inspection helper syntax
        run: python3 -m py_compile tools/inspect_gd_apk.py
      - name: Check APK inspection helper CLI
        run: python3 tools/inspect_gd_apk.py --help
      - run: npm test
      - name: Validate project JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('catalog.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('geode-mod/mod.json','utf8'))"

  native-planner-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile native autoplay planner tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Inative-loader/autoplay \
            native-loader/autoplay/autoplay_planner.cpp \
            native-loader/tests/autoplay_planner_test.cpp \
            -o autoplay-planner-test
      - name: Run native autoplay planner tests
        run: ./autoplay-planner-test

  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Build Android debug APK
        run: gradle --refresh-dependencies -p android-app assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gdm-loader-android-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
